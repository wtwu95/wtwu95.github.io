name: Update github myprofile

on: 'page_build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Generate profile README
      run: |
        cd ./github_myprofile_updater
        python3 update.py
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add github_myprofile_updater/README.md github_myprofile_updater/images
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "update my description automatically"
        git push
