name: Update github myprofile

on: 'page_build'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./github_myprofile_updater
        python3 update.py
        git config user.name "${{ github.actor }}"
        git config user.email "wtwu95@gmail.com"
        git add README.md
        git add images
        git commit -m "update my description automatically" || echo "No changes to commit"
        git push origin HEAD:main
