name: Update github myprofile

on: 'page_build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Update profile content
      run: |
        cd ./github_myprofile_updater
        python3 update.py
    - name: Commit changes
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "wtwu95@gmail.com"
        git add github_myprofile_updater/README.md
        git add github_myprofile_updater/images
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "update my description automatically"
          git push origin HEAD:"${DEFAULT_BRANCH}"
        fi
