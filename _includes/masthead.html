<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="{{ '/' | relative_url }}#about-me" target="_self">
              <span data-lang="en">Homepage</span>
              <span data-lang="zh" hidden>首页</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ link.url | relative_url }}" target="_self">
                <span data-lang="en">{{ link.title_en }}</span>
                <span data-lang="zh" hidden>{{ link.title_zh }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="masthead__actions" role="presentation">
      <button
        type="button"
        class="toggle-button toggle-button--language"
        data-language-toggle
        aria-label="Switch to Chinese"
        aria-pressed="false"
      >
        <span
          class="toggle-button__icon toggle-button__icon--language toggle-button__icon--language-en"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path
              d="M6.5 18.5 12 5l5.5 13.5"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
            <path
              d="M8.75 14.25h6.5"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </span>
        <span
          class="toggle-button__icon toggle-button__icon--language toggle-button__icon--language-zh"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path
              d="M4.5 6.5h15"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
            <path
              d="M6.8 6.5c2.9 3.75 6 6.2 10.7 7.75"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
            <path
              d="M17.2 6.5c-2.9 3.75-6 6.2-10.7 7.75"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
            <path
              d="M9.25 17.75h5.5"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
            <path
              d="M12 13.75v6"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </span>
      </button>
      <button
        type="button"
        class="toggle-button toggle-button--theme"
        data-theme-toggle
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <span class="toggle-button__icon toggle-button__icon--sun" aria-hidden="true">☀️</span>
        <span class="toggle-button__icon toggle-button__icon--moon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </div>
</div>
