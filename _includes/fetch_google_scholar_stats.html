<script>
(function () {
  'use strict';
  var publications = null;

  function updateCitations() {
    if (!publications) return;
    document.querySelectorAll('.show_paper_citations').forEach(function (element) {
      var paper = publications[element.getAttribute('data')];
      var count = paper && paper.num_citations;
      if (typeof count === 'number' && isFinite(count) && count >= 0) {
        element.textContent = '| Citations: ' + count;
      }
    });
  }

  function loadCitations() {
    if (!document.querySelector('.show_paper_citations') || !window.fetch) return;
    {% if site.google_scholar_stats_use_cdn %}
    var url = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    {% else %}
    var url = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    {% endif %}
    fetch(url)
      .then(function (response) {
        if (!response.ok) throw new Error('Citation data unavailable');
        return response.json();
      })
      .then(function (data) {
        publications = data && data.publications;
        updateCitations();
      })
      .catch(function () {
        // Citation counts are optional; keep the page usable if the service fails.
      });
  }

  document.addEventListener('publications:rendered', updateCitations);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadCitations, { once: true });
  } else {
    loadCitations();
  }
})();
</script>
